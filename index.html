<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogues films-Séries</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Catalogues de films-séries</h2>

    <p>Retrouvés des films, séries par genre , les avis recensés et autres détails interessants.</p>

    <div id="filtres" class="filtres">
        <button class="btn-filtre" data-genre="Action">Action 🥊</button>
        <button class="btn-filtre" data-genre="Animation">Animation 🫟</button>
        <button class="btn-filtre" data-genre="Aventure">Aventure 🗺️</button>
        <button class="btn-filtre" data-genre="Comédie">Comédie 😂</button>
        <button class="btn-filtre" data-genre="Comédie romantique">Comédie romantique 🧑🏽‍❤️‍💋‍👩🏼</button>
        <button class="btn-filtre" data-genre="Documentaire">Documentaire 🎥</button>
        <button class="btn-filtre" data-genre="Drame">Drame 🎭</button>
        <button class="btn-filtre" data-genre="Fantastique">Fantastique 🧙‍♂️</button>
        <button class="btn-filtre" data-genre="Guerre">Guerre ⚔️</button>
        <button class="btn-filtre" data-genre="Horreur">Horreur 👻</button>
        <button class="btn-filtre" data-genre="Mystere">Mystere 🔍</button>
        <button class="btn-filtre" data-genre="Policier Crime">Policier/ Crime 🚔</button>
        <button class="btn-filtre" data-genre="Romance">Romance 💘💌</button>
        <button class="btn-filtre" data-genre="Science-fiction">Science-fiction 🚀</button>
        <button class="btn-filtre" data-genre="Sport">Sport ⚽</button>
        <button class="btn-filtre" data-genre="Thriller">Thriller 🔪</button>
        <button class="btn-filtre" data-genre="tous">Tous</button>
    </div>

    <input type="text" id="recherche" placeholder="Film/Série...">
    <button id="btn-recherche">Rechercher</button>

    <div class="contenu" id="les-catalogues">



    </div>

    <script src="script.js"></script>
</body>
</html>
